name: Refresh engineering dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard
        run: python dashboard/generate_dashboard.py

      - name: Commit dashboard update
        run: |
          if [[ -n "$(git status --porcelain -- dashboard/index.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/index.md
            git commit -m "Update engineering dashboard"
            git push
          else
            echo "Dashboard is already up to date."
          fi
